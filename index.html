<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Painel de Filmes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            z-index: 100;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 10%, transparent);
        }
        .logo {
            color: #E50914;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .banner {
            height: 480px;
            background-color: #222;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            position: relative;
        }
        .banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(180deg, transparent, #111);
        }
        .banner-content {
            z-index: 1;
            max-width: 600px;
        }
        .banner-title {
            font-size: 42px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        .banner-btns {
            display: flex;
            gap: 10px;
        }
        .banner-btn {
            background-color: rgba(51,51,51,0.8);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .banner-btn:hover {
            background-color: #e6e6e6;
            color: #000;
        }
        .row {
            margin: 30px 0 30px 40px;
        }
        .row h2 {
            margin-bottom: 15px;
            font-size: 20px;
            color: #e5e5e5;
        }
        .row-posters {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 15px;
            padding-bottom: 20px;
            scrollbar-width: none;
        }
        .row-posters::-webkit-scrollbar {
            display: none;
        }
        .movie-card {
            min-width: 180px;
            height: 260px;
            background-color: #222;
            border-radius: 4px;
            object-fit: cover;
            transition: transform 300ms ease;
            cursor: pointer;
        }
        .movie-card:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NETFLIX</div>
    </header>

    <div class="banner" id="main-banner">
        <div class="banner-content">
            <h1 class="banner-title" id="banner-title">Carregando catálogo...</h1>
            <div class="banner-btns">
                <button class="banner-btn">▶ Assistir</button>
                <button class="banner-btn">ℹ Mais Informações</button>
            </div>
        </div>
    </div>

    <div class="row">
        <h2>Filmes em Destaque</h2>
        <div class="row-posters" id="poster-container">
            <!-- Os cards serão injetados aqui via JavaScript -->
        </div>
    </div>

    <script>
        // Credenciais obtidas através da imagem da RapidAPI
        const apiKey = '2981e7072msh7c1be16f30f788ap1a37e1jsn4424707c8b9e';
        const apiHost = 'streaming-availability.p.rapidapi.com';

        const options = {
            method: 'GET',
            headers: {
                'x-rapidapi-key': apiKey,
                'x-rapidapi-host': apiHost
            }
        };

        async function loadNetflixData() {
            try {
                // Requisição utilizando um ID de filme de exemplo na API de Streaming Availability
                const response = await fetch('https://streaming-availability.p.rapidapi.com/shows/movie/tt0111161', options);
                const data = await response.json();
                
                const container = document.getElementById('poster-container');
                const banner = document.getElementById('main-banner');
                const bannerTitle = document.getElementById('banner-title');
                
                if (data && data.item) {
                    const item = data.item;
                    bannerTitle.innerText = item.title || 'Filme em Destaque';
                    
                    if (item.backdropURL) {
                        banner.style.backgroundImage = `url('${item.backdropURL}')`;
                    }

                    // Preenchendo o carrossel com os dados obtidos
                    for (let i = 0; i < 8; i++) {
                        const img = document.createElement('img');
                        img.src = item.posterURL || item.backdropURL || 'https://via.placeholder.com/180x260?text=Sem+Capa';
                        img.className = 'movie-card';
                        container.appendChild(img);
                    }
                }
            } catch (error) {
                console.error('Erro ao conectar com a API:', error);
                document.getElementById('banner-title').innerText = 'Falha ao carregar dados da API';
            }
        }

        loadNetflixData();
    </script>
</body>
</html>
