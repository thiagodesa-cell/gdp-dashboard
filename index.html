<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Painel de Filmes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #111; color: #fff; font-family: Arial, sans-serif; overflow-x: hidden; }
        header { padding: 20px 40px; background: #000; }
        .logo { color: #E50914; font-size: 28px; font-weight: bold; }
        .banner {
            height: 400px;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            background-color: #222;
        }
        .banner-title { font-size: 36px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .row { margin: 30px 0 30px 40px; }
        .row h2 { margin-bottom: 15px; font-size: 20px; color: #e5e5e5; }
        .row-posters { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; scrollbar-width: none; }
        .row-posters::-webkit-scrollbar { display: none; }
        .movie-card { min-width: 160px; height: 240px; border-radius: 4px; object-fit: cover; background-color: #333; }
    </style>
</head>
<body>

    <header>
        <div class="logo">STREAMFLIX</div>
    </header>

    <div class="banner" id="main-banner">
        <h1 class="banner-title" id="banner-title">Carregando filme...</h1>
    </div>

    <div class="row">
        <h2>Detalhes do Catálogo</h2>
        <div class="row-posters" id="poster-container"></div>
    </div>

    <script>
        const apiKey = '2981e7072msh7c1be16f30f788ap1a37e1jsn4424707c8b9e';
        const apiHost = 'streaming-availability.p.rapidapi.com';

        const options = {
            method: 'GET',
            headers: {
                'x-rapidapi-key': apiKey,
                'x-rapidapi-host': apiHost
            }
        };

        async function fetchMovie() {
            try {
                // Buscando o filme Um Sonho de Liberdade (tt0111161) de exemplo
                const response = await fetch('https://streaming-availability.p.rapidapi.com/shows/tt0111161?series_granularity=episode&output_language=en', options);
                const data = await response.json();
                
                if (data) {
                    document.getElementById('banner-title').innerText = data.title || 'Filme';
                    
                    if (data.backdropUrl) {
                        document.getElementById('main-banner').style.backgroundImage = `url('${data.backdropUrl}')`;
                    }

                    const container = document.getElementById('poster-container');
                    // Cria alguns cards repetidos para simular o carrossel da Netflix
                    for (let i = 0; i < 6; i++) {
                        const img = document.createElement('img');
                        img.src = data.posterUrl || 'https://via.placeholder.com/160x240';
                        img.className = 'movie-card';
                        container.appendChild(img);
                    }
                }
            } catch (err) {
                console.error('Erro:', err);
                document.getElementById('banner-title').innerText = 'Erro ao carregar dados.';
            }
        }

        fetchMovie();
    </script>
</body>
</html>
